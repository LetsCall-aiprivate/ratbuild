name: Build RAT APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Force Java 17 (BEFORE anything sdk uses it)
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/temurin-17-jdk-amd64/bin" >> $GITHUB_PATH
          /usr/lib/jvm/temurin-17-jdk-amd64/bin/java -version

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android/sdk /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h

      - name: Wipe any stale buildozer state
        run: rm -rf ~/.buildozer

      - name: Pre-install SDK command-line tools + accept licenses
        run: |
          SDK=/home/runner/.buildozer/android/platform/android-sdk
          mkdir -p $SDK/cmdline-tools $SDK/licenses
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK/licenses/android-sdk-license
          printf "\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> $SDK/licenses/android-sdk-license
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" >> $SDK/licenses/android-sdk-license
          printf "\nd975f751698a77b662f1254ddbe0b4262bafe0e0" >> $SDK/licenses/android-sdk-license
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > $SDK/licenses/android-sdk-preview-license
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdl.zip
          unzip -q /tmp/cmdl.zip -d $SDK/cmdline-tools
          mv $SDK/cmdline-tools/cmdline-tools $SDK/cmdline-tools/latest
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $SDK/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "build-tools;34.0.0" "platforms;android-33" > /dev/null
          mkdir -p $SDK/tools/bin
          ln -sf $SDK/cmdline-tools/latest/bin/sdkmanager $SDK/tools/bin/sdkmanager
          ln -sf $SDK/cmdline-tools/latest/bin/avdmanager $SDK/tools/bin/avdmanager
          ls $SDK/build-tools

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev
          sudo apt-get install -y openjdk-17-jdk || true
          sudo apt-get install -y libncurses5-dev libtinfo5 || true

      - name: Install Buildozer
        run: |
          pip install buildozer Cython==0.29.33

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rat-apk
          path: bin/*.apk
